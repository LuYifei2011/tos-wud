name: Bug report
description: Report a packaging or TOS integration problem.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: TOS version, NAS model, CPU architecture and app version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, tokens, session cookies and private addresses before posting.
      render: text
